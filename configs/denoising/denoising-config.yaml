seed_everything: 41
trainer:
  strategy: auto
  accelerator: gpu
  num_nodes: 1
  precision: null
  logger: 
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: 
      save_dir: 'denoising-logs'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary      
    init_args: 
       max_depth: 3
  # - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  #   init_args:
  #     logging_interval: 'epoch'
  # - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
  #   init_args: 
  #     save_last: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
    init_args: 
      mode: 'min'
      monitor: 'val_loss'
      filename:  '{epoch:03d}-{val_loss:.4f}-{val_r2:.3f}'
      save_last: true
  fast_dev_run: false
  max_epochs: 50
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.denoising.denoising.SpectraDenoiserLit
  init_args:
    input_channels: 2
    output_channels: 2
    d_model: 64
    encoder_depth: 4
    nhead: 4
    mlp_dim: 256
    dim_head: 64
    pos_embedding_type: 'sin_cos' # choose between 'sin_cos' and 'trainable'
    lr: 0.00015
    weight_decay: 0.000001
    dropout: 0.
    emb_dropout: 0.
    # pretrained_ckpt: "encoder-ckpts/mae-base/version_13/checkpoints/last.ckpt"
    pretrained_ckpt: null
    freeze_encoder: false
data:
  class_path: raman.dataloaders.data_mda_spectral.MDADenoisingDataModule
  init_args:
    batch_size: 64
    num_workers: 2
    pin_memory: false
    train_input_file: '../datasets/MDA-Spectral/Train_Inputs.mat'
    train_output_file: '../datasets/MDA-Spectral/Train_Outputs.mat'
    test_input_file: '../datasets/MDA-Spectral/Test_Inputs.mat'
    test_output_file: '../datasets/MDA-Spectral/Test_Outputs.mat'
    axis_file: '../datasets/MDA-Spectral/axis.txt'
    val_split: 0.1
ckpt_path: null

