seed_everything: 17
trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger: 
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: 
      save_dir: 'sugars-concentration-logs'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary      
    init_args: 
       max_depth: 3
  # - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  #   init_args:
  #     logging_interval: 'epoch'
  # - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
  #   init_args: 
  #     save_last: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
    init_args: 
      mode: 'min'
      monitor: 'val_loss'
      filename:  '{epoch:03d}-{val_loss:.4f}-{val_r2:.3f}'
      save_last: true
  fast_dev_run: false
  max_epochs: 50
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.cls.spectra_encoder_cls.SpectraEncoderClassifierLit
  init_args:
    num_classes: 5
    input_channels: 2
    d_model: 128
    encoder_depth: 4
    nhead: 4
    mlp_dim: 512
    dim_head: 128
    hidden_dim: 256
    pos_embedding_type: 'sin_cos'
    lr: 0.00015
    weight_decay: 1.0e-06
    dropout: 0.0
    emb_dropout: 0.0
    cls_token: true
    classification_head: 'mlp'
    task: 'multilabel'
data:
  class_path: raman.dataloaders.data_sugars.SugarMultiLabelDataModule
  init_args:
    spectra_csv: "../datasets/Raman_Sugars/Sugar_Concentration_Test_Fast_ALL_spectra.csv"
    metadata_csv: "../datasets/Raman_Sugars/Sugar_Concentration_Test_Fast_ALL_metadata.csv"
    batch_size: 64
    num_workers: 2
    pin_memory: false
    preprocess: "normalization"
    augment: false
    val_split: 0.1
    test_split: 0.1
optimizer: null
lr_scheduler: null
ckpt_path: null
