seed_everything: 17
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger:
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: 'cls-logs-multitask-finetune'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
       max_depth: 3
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      mode: 'min'
      monitor: 'val_loss'
      filename:  '{epoch:03d}-{val_loss:.4f}'
      save_last: true
  - class_path: raman.cls.spectra_encoder_multitask_cls.SaveEncoderCallback
    init_args:
      out_path: 'finetuned_encoder.ckpt'
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.cls.spectra_encoder_multitask_cls.SpectraEncoderMultiTaskClsLit
  init_args:
    # Set to a trained MAE checkpoint (e.g. mae-logs-*/version_N/checkpoints/last.ckpt)
    # to finetune a pretrained encoder; leave null to train an encoder from scratch
    # using the architecture args below.
    pretrained_ckpt: null
    freeze_encoder: false
    # Optional, typically-lower LR for the pretrained encoder vs. the fresh heads
    # below (helps avoid destructive updates to pretrained weights). Defaults to
    # the shared `lr` (single param group) when left null.
    encoder_lr: null
    input_channels: 2
    d_model: 128
    encoder_depth: 4
    mlp_dim: 256
    nhead: 4
    dim_head: 128
    pos_embedding_type: 'sin_cos' # choose between 'sin_cos' and 'trainable'
    dropout: 0.
    emb_dropout: 0.
    cls_token: true
    lr: 0.00015
    weight_decay: 0.000001
    tasks_config:
      - task: "adenine"
        num_classes: 2
        classification_head: 'mlp'
        hidden_dim: 256
      - task: "bacteria"
        num_classes: 30
        classification_head: 'mlp'
        hidden_dim: 256
      - task: "liver-cancer"
        num_classes: 2
        classification_head: 'mlp'
        hidden_dim: 256
      - task: "sangxiancheng1"
        num_classes: 192
        classification_head: 'mlp'
        hidden_dim: 256
      - task: "sangxiancheng2"
        num_classes: 1332
        classification_head: 'mlp'
        hidden_dim: 256
      # - task: "<new_dataset>"
      #   num_classes: <n>
      #   classification_head: 'mlp'
      #   hidden_dim: 256
data:
  class_path: raman.dataloaders.multitask_dataloader.MultiTaskDataModule
  init_args:
    datasets_config:
      - task: "adenine"
        datamodule:
          class_path: raman.dataloaders.data_adenine.AdenineDataModule
          init_args:
            data_file: "../datasets/Adenine/ILSdata.csv"
            concentration_level: 3
            preprocess: normalization
            batch_size: 32
            num_workers: 2
            pin_memory: false
            augment: true
            sliced: false
      - task: "bacteria"
        datamodule:
          class_path: raman.dataloaders.data_bacteria.BacteriaDataModule
          init_args:
            data_dir: "../datasets/Bacteria"
            preprocess: normalization
            batch_size: 32
            num_workers: 2
            pin_memory: false
            augment: true
            sliced: false
      - task: "sangxiancheng1"
        datamodule:
          class_path: raman.dataloaders.data_sangxiancheng.SangXianchengDataModule
          init_args:
            data_dir: "../datasets/SangXiancheng/raw_data/Dataset_1"
            preprocess: none
            batch_size: 32
            num_workers: 2
            pin_memory: false
            augment: true
            sliced: false
      - task: "sangxiancheng2"
        datamodule:
          class_path: raman.dataloaders.data_sangxiancheng.SangXianchengDataModule
          init_args:
            data_dir: "../datasets/SangXiancheng/raw_data/Dataset_2"
            preprocess: none
            batch_size: 32
            num_workers: 2
            pin_memory: false
            augment: true
            sliced: false
      - task: "liver-cancer"
        datamodule:
          class_path: raman.dataloaders.data_liver.RamanLiverDataModule
          init_args:
            data_dir: "../datasets/Liver Cancer/data_liver" 
            preprocess: normalization
            batch_size: 32
            num_workers: 2
            pin_memory: false
            augment: true
            sliced: false
ckpt_path: null
