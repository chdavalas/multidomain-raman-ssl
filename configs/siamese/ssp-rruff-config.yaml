seed_everything: 17
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16
  logger: 
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: 
      save_dir: 'siamese-logs'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary      
    init_args: 
       max_depth: 3
  # - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  #   init_args:
  #     logging_interval: 'epoch'
  # - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
  #   init_args: 
  #     save_last: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
    init_args: 
      mode: 'min'
      monitor: 'val_loss'
      filename:  '{epoch:03d}-{val_loss:.4f}-{val_r2:.3f}'
      save_last: true
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.siamese.ssp.SSPLit
  init_args:
      num_classes: 2
      lr: 0.01
      weight_decay: 1.0e-06
      input_channels: 2
      siamese_type: 'cnn'
      dim: 128
      depth: 4
      heads: 4
      mlp_dim: 512
      dim_head: 64
      pos_embedding_type: 'sin_cos'
      dropout: 0.1
      emb_dropout: 0.1
      fc1_size: 1024
      test_threshold: 0.5  # Adjust detection threshold here
data:
  class_path: raman.dataloaders.siamese_dataloader.SiameseDataModule
  init_args:
    batch_size: 32
    num_workers: 2
    pin_memory: false
    subsampling_ratio: 0.019
    test_split: 0.1
    val_split: 0.1
    base_datamodule:
      class_path: raman.dataloaders.data_rruff.RRUFFDataModule
      init_args:
        data_dir: "../datasets/RRUFF" 
        preprocess: z_score
        augment: true
ckpt_path: null