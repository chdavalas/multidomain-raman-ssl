seed_everything: 41
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16
  logger: 
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: 
      save_dir: 'r6g-base-logs'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary      
    init_args: 
       max_depth: 3
  # - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  #   init_args:
  #     logging_interval: 'epoch'
  # - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
  #   init_args: 
  #     save_last: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
    init_args: 
      mode: 'min'
      monitor: 'val_loss'
      filename:  '{epoch:03d}-{val_loss:.4f}-{val_r2:.3f}'
      save_last: true
  fast_dev_run: false
  max_epochs: 50
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.siamese.siamese.SiameseLit
  init_args:
      encoder_type: 'spectra'
      num_classes: 2
      lr: 0.00015
      weight_decay: 0.000001
      input_channels: 2
      d_model: 128
      encoder_depth: 4
      nhead: 4
      mlp_dim: 512
      dim_head: 128
      pos_embedding_type: 'sin_cos'
      dropout: 0.
      emb_dropout: 0.
      cls_token: false
      projection_dim: 128 
      closs_margin: 1.0
      shared_weights: false
      classification: true
      loss_ratio: 0.25
      # pretrained_ckpt: "encoder-ckpts/mae-base/version_13/checkpoints/last.ckpt"
      pretrained_ckpt: null
      freeze_encoder: false
      classification_head: 'mlp'
data:
  class_path: raman.dataloaders.data_r6g.R6GDataModule
  init_args:
    batch_size: 64
    num_workers: 2
    pin_memory: false
    preprocess: global_normalization
    data_dir:  "../datasets/R6G_dataset/"
    reference_dir: "R6G/Reference"
    positive_dir: "R6G/Mixtures"
    negative_dir: "No_R6G/Liquid_Mixtures/514nm"
    augment: true
    balance: false
    test_split: 0.1
    val_split: 0.1
ckpt_path: null
