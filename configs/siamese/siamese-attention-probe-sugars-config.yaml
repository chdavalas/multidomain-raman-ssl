seed_everything: 17
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16
  logger: 
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: 
      save_dir: 'sugars-logs-att-probe'
      name: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelSummary      
    init_args: 
       max_depth: 3
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint      
    init_args: 
      mode: 'min'
      monitor: 'val_loss'
      filename: '{epoch:03d}-{val_loss:.4f}-{val_auc:.3f}'
      save_last: true
  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 1
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  gradient_clip_algorithm: 'norm'
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  class_path: raman.siamese.attention_probe.SiameseCrossAttentionProbeLit
  init_args:
      num_classes: 2
      lr: 0.00015
      weight_decay: 0.000001
      nhead: 4
      dropout: 0.0
      pretrained_ckpt: "encoder-ckpts/mae-base/version_13/checkpoints/last.ckpt"
      freeze_encoder: true
data:
  class_path: raman.dataloaders.data_sugars.SugarSiameseDataModule
  init_args:
    batch_size: 64
    num_workers: 2
    pin_memory: false
    preprocess: z_score
    spectra_csv: "../datasets/Raman_Sugars/Sugar_Concentration_Test_Fast_ALL_spectra.csv"
    metadata_csv: "../datasets/Raman_Sugars/Sugar_Concentration_Test_Fast_ALL_metadata.csv"
    augment: false
    balance: false
    test_split: 0.1
    val_split: 0.1
    task_type: "binary"
ckpt_path: null